version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Held on 6.x: TypeScript 7 dropped the compiler API astro check depends on. See ADR 0006.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
